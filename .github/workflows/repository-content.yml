name: Repository source boundary
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reject-game-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified official v4
        with:
          fetch-depth: 0
      - run: python3 tools/repository_content_check.py
      - run: python3 tools/repository_content_check.py --history
